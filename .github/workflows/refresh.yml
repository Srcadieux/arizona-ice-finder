name: Refresh Arizona ice schedules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
concurrency:
  group: arizona-ice-schedule-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Refresh rink schedules
        run: python scripts/update_events.py

      - name: Commit any schedule changes
        run: |
          git config user.name "arizona-ice-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json

          if git diff --cached --quiet; then
            echo "No schedule changes to commit."
            exit 0
          fi

          git commit -m "Auto-refresh rink schedules"

          echo "Syncing with latest main before push..."
          git pull --rebase origin main

          git push origin HEAD:main
